<!DOCTYPE html>
<html>
<head>
    <title>AI Study Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🤖 AI Study Lab</h1>

    <p>Learn, Practice & Improve Your AI Skills</p>

    <h2>Welcome to AI Study Lab!</h2>

    <button onclick="showLesson()">🚀 Start Learning</button>

    <div id="lesson" style="display:none;">
        <h2>✍️ Lesson 1: What is an AI Prompt?</h2>

        <p>A prompt is the instruction or question you give to an AI.</p>

        <p><strong>Example:</strong></p>

        <p>Explain Newton's Rings in simple words.</p>
    </div>
<div id="challenge">

    <h2>🎯 Try It Yourself</h2>

    <p>Write a prompt asking AI to explain any topic.</p>

    <textarea id="userPrompt" placeholder="Example: Explain photosynthesis in simple words."></textarea>

    <br><br>

    <button onclick="checkPrompt()">🔍 Check My Prompt</button>

    <p id="feedback"></p>

</div>
    <script> 
        function checkPrompt() {
    let prompt = document.getElementById("userPrompt").value.trim();
    let feedback = document.getElementById("feedback");

    if (prompt === "") {
        feedback.innerText = "⚠️ Please write a prompt first.";
        return;
    }

    let words = prompt.split(/\s+/).length;

    if (words < 5) {
        feedback.innerText =
            "💡 Your prompt is a little short. Add more details about what you want.";
    } 
    else if (prompt.includes("?") || prompt.toLowerCase().includes("explain") ||
             prompt.toLowerCase().includes("give") ||
             prompt.toLowerCase().includes("write")) {
        feedback.innerText =
            "🌟 Good prompt! It contains a clear request. Try adding the format or level of detail you want.";
    } 
    else {
        feedback.innerText =
            "👍 Good start! Add a clear instruction such as 'Explain', 'Compare', or 'Give examples'.";
    }
        }
    }
        }
        function showLesson() {
            document.getElementById("lesson").style.display = "block";
        }
    </script>

</body>
</html>
